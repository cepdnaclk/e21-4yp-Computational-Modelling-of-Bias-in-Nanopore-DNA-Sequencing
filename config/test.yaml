# SMALL TEST of every pipeline value: one pass FAST5 file (2,890 reads), fast models,
# small test databases: refset = databases/refset_test (3 Ulva chloroplasts + 2 bacteria),
# refset_nohost = the 2 bacteria only (kraken2, kaiju, centrifuger + search), standard_8gb = real Kraken2 Standard-8.
# Upstream variety:  ./run_pipeline.sh config/test.yaml --select analysis=none
# Every analysis:    ./run_pipeline.sh config/test.yaml --select basecall=guppy-6.2.1:fast --select trim=porechop --select qfilter=meanerr --select minq=9
sample: seaweed_green_jafna_A
outdir: /home/induwara/dna_data/FYP/outputs_test
fast5:
- /home/induwara/dna_data/FYP/fast5_pass-20260930T045200Z-1-001/fast5_pass/FAX38735_pass_0b607977_50b67caa_5.fast5
threads: 16
gpu_device: cuda:all
taxonomy: /home/induwara/dna_data/FYP/databases/taxonomy
host_taxid: '3118'
qc_constants:
  maxlen: 50000
host_map:
  mapq: 0,20,60
trim:
  lsk110_top: CCTGTACTTCGTTCAGTTACGTATTGCT
  lsk110_bottom: GCAATACGTAACTGAACGAAGTACAGG
  cutadapt_error: 0.2
  cutadapt_overlap: 12
  headcrop: 30
  tailcrop: 10
  scan_window: 150
blast:
  subsample: 300
  seed: 11
  evalue: 1e-5
  max_target_seqs: 5
design:
  mode: full
  baseline:
    basecall: guppy-6.2.1:fast
    trim: porechop
    qfilter: meanerr
    minq: 9
    keep: 90
    minlen: 0
    aligner: minimap2
    host_ref: ulva_chloroplast
    confidence: 0
    blast_tool: megablast
    classifier: kraken2
    refdb: refset
factors:
  basecall:
  - guppy-6.2.1:fast
  - guppy-6.5.7:fast
  - dorado-0.9.6:fast
  - bonito-0.7.3:fast
  trim:
  - none
  - porechop
  - porechop_abi
  - porechop_lsk110
  - cutadapt_lsk110
  - headcrop
  qfilter:
  - meanerr
  - meanphred
  - filtlong
  minq:
  - 0
  - 9
  keep:
  - 90
  minlen:
  - 0
analyses:
  host_map:
    aligner:
    - minimap2
    - winnowmap
    - ngmlr
    - lra
    - hostile
    host_ref:
    - ulva_chloroplast
  classify:
    classifier: &id001
    - kraken2
    - krakenuniq
    - centrifuge
    - centrifuger
    - kaiju
    - metabuli
    - ganon
    - taxor
    - kmcp
    - sylph
    - diamond
    - megan
    refdb:
    - refset
    - refset_nohost
    - standard_8gb
    confidence:
    - 0
    - 0.1
    - 0.5
  blast:
    blast_tool:
    - megablast
    - dc-megablast
    - blastn
    - minimap2
    - diamond
    - last
    - mmseqs2
    refdb:
    - refset
    - refset_nohost
resources:
  basecallers:
    guppy-6.2.1:
      type: guppy
      bin: ~/tools/guppy-6.2.1/bin/guppy_basecaller
      models:
        fast: dna_r9.4.1_450bps_fast.cfg
        hac: dna_r9.4.1_450bps_hac.cfg
        sup: dna_r9.4.1_450bps_sup.cfg
    guppy-6.5.7:
      type: guppy
      bin: ~/tools/guppy-6.5.7/bin/guppy_basecaller
      models:
        fast: dna_r9.4.1_450bps_fast.cfg
        hac: dna_r9.4.1_450bps_hac.cfg
        sup: dna_r9.4.1_450bps_sup.cfg
    dorado-0.9.6:
      type: dorado
      bin: ~/tools/dorado-0.9.6-linux-x64/bin/dorado
      models_dir: ~/tools/dorado_models
      models:
        fast: dna_r9.4.1_e8_fast@v3.4
        hac: dna_r9.4.1_e8_hac@v3.3
        sup: dna_r9.4.1_e8_sup@v3.3
    bonito-0.7.3:
      type: bonito
      bin: ~/anaconda3/envs/env-bonito/bin/bonito
      models_dir: ~/anaconda3/envs/env-bonito/lib/python3.10/site-packages/bonito/models
      models:
        fast: dna_r9.4.1_e8_fast@v3.4
        hac: dna_r9.4.1_e8_hac@v3.3
        sup: dna_r9.4.1_e8_sup@v3.3
    minknow-live:
      type: import
      models:
        fast:
          fastq:
          - /home/induwara/dna_data/FYP/fastq_pass-20260930T050807Z-1-001/fastq_pass
          - /home/induwara/dna_data/FYP/fastq_fail-20260930T050001Z-1-001/fastq_fail
    guppy-6.2.1-lab:
      type: import
      models:
        hac:
          fastq:
          - /home/induwara/dna_data/FYP/Basecall_HAC_output-20260924T045029Z-1-001/Basecall_HAC_output/OUTPUT/pass
          - /home/induwara/dna_data/FYP/Basecall_HAC_output-20260924T045029Z-1-001/Basecall_HAC_output/OUTPUT/fail
  host_refs:
    ulva_chloroplast:
      fasta: /home/induwara/dna_data/FYP/references/ulva_chloroplast/ulva_chloroplast.fa
  refdbs:
    refset:
      root: /home/induwara/dna_data/FYP/databases/classify_test
      classifiers: *id001
      search: /home/induwara/dna_data/FYP/databases/blast_test/refset
    refset_nohost:
      root: /home/induwara/dna_data/FYP/databases/refdb_test/refset_nohost
      classifiers:
      - kraken2
      - kaiju
      - centrifuger
      search: /home/induwara/dna_data/FYP/databases/refdb_test/refset_nohost/search/refdb
    standard_8gb:
      root: /home/induwara/dna_data/FYP/databases/refdb/standard_8gb
      classifiers:
      - kraken2
